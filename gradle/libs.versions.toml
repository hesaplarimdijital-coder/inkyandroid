# Every version is pinned. The build tools are the ones desktop-kit 2.9.0 is built with:
# AGP 9.4.1, Gradle 9.8.2 (gradle/wrapper), Kotlin 2.4.20; tests run on Java 21.
# Compose (BOM 2026.09.00), Navigation and Haze come with the kit at the versions it was built with.
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# desktop-kit 2.10.0 as merged into its main (5aa957d0d3, VERSION_NAME=2.10.0); the tag is pending: switch this
# line to "2.10.0" once the owner has tagged the release
desktopKit = "5aa957d0d3"
activityCompose = "1.13.0"
# ink: blade-ink is the Java port of ink's runtime and compiler, at the level of ink 1.2.0;
# the runtime and the compiler are released together under one version.
bladeInk = "1.3.3"
# the kit's version
coroutines = "1.11.0"
# JSON tree API only (no compiler plugin), for the project settings file; built with Kotlin 2.4.10
kotlinxSerialization = "1.13.0"
junit = "4.13.2"
# The ink manual is parsed with commonmark-java (BSD-2-Clause) and drawn by the app itself
commonmark = "0.33.0"
# The tests of :app, as in the kit: Robolectric 4.17 runs Android 16 (API 36) on Java 21.
robolectric = "4.17"
testCore = "1.7.0"
testExtJunit = "1.3.0"
# The kit's Compose BOM once more, only to name the version of the Compose test artifacts;
# raise it together with the kit.
composeBom = "2026.09.00"

[libraries]
desktop-kit = { module = "com.github.hesaplarimdijital-coder:desktop-kit", version.ref = "desktopKit" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
blade-ink = { module = "com.bladecoder.ink:blade-ink", version.ref = "bladeInk" }
blade-ink-compiler = { module = "com.bladecoder.ink:blade-ink-compiler", version.ref = "bladeInk" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
test-core = { module = "androidx.test:core", version.ref = "testCore" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "testExtJunit" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Never applied (AGP 9 compiles Kotlin itself); declared in the root build file only to pin the Kotlin version.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
